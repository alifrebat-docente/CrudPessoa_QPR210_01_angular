<div id="div-lista">
    <h1> Lista Pessoa </h1>

    <div id="div-lista-pessoas">
        @for(elem of listar(); track elem.id ){
        <div class="div-item-pessoa">
            <span class="item-pessoa">
                {{elem.id}} - {{elem.nome}} - {{elem.cpf}} - {{elem.dataNascimento}} - {{elem.email}} </span>
            <span class="btns-lista">
                    <a class="lnk-btn lnk-editar" (click)="buscarPorId(elem)"> Editar </a>
                    <a class="lnk-btn lnk-excluir"  (click)="exluir(elem)"> Excluir </a>
                </span>
        </div>
        }@empty{

        <div class="div-item-pessoa">
            NENHUM REGISTRO NA LISTA
        </div>
        }
